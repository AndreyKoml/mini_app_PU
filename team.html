        /* ---------- шторка перехода между версиями ProdU ---------- */
        .curtain { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #f5f1ed; transition: opacity .45s ease, visibility .45s; }
        html.pre-dark .curtain, body[data-theme="dark"] .curtain { background: #252323; }
        .curtain.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .curtain svg { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 10px 40px rgba(112, 224, 0, .25); animation: curtainLogo .6s cubic-bezier(.3, 1.5, .5, 1) both; }

        .app-wipe { position: fixed; inset: 0; z-index: 10001; pointer-events: none; display: grid; place-items: center; clip-path: circle(0 at var(--x) var(--y));
            transition: clip-path .5s cubic-bezier(.6, 0, .3, 1); }
        .app-wipe.go { clip-path: circle(150vmax at var(--x) var(--y)); }
        .app-wipe svg { width: 96px; height: 96px; }

        :root { --accent-color: #8fe11a; --green-1: #9EF01A; --green-2: #70E000; --danger: #ff4757; --warn: #ffa502; --blue: #3b9cff; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100vh; color: var(--text-color); background: var(--bg-color);
            font-family: 'ProdU Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; letter-spacing: -0.005em;
            --text-color: #1a1a1a;
            --surface: rgba(250, 248, 245, 0.6); --surface-edge: rgba(255, 255, 255, 0.85);
            --tile: rgba(255, 255, 255, 0.86); --tile-shadow: 0 2px 10px rgba(40, 30, 20, 0.08);
            --pill: #ffffff; --pill-shadow: 0 2px 8px rgba(40, 30, 20, 0.13);
            --ring-track: rgba(0, 0, 0, .09); --nav-bg: rgba(247, 244, 240, 0.86); --nav-active: rgba(0, 0, 0, 0.07);
            --card-shadow: 0 8px 28px rgba(60, 50, 40, 0.08); --green: linear-gradient(180deg, #9EF01A, #70E000);
            --muted: rgba(0, 0, 0, .5); --ex-ic: #70E000;
            transition: background-color .3s, color .3s;
        }
        body[data-theme="dark"] {
            --text-color: #ffffff; color-scheme: dark;
            --surface: rgba(66, 66, 66, 0.6); --surface-edge: rgba(255, 255, 255, 0.07);
            --tile: rgba(24, 24, 24, 0.86); --tile-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
            --pill: rgba(86, 86, 86, 0.95); --pill-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            --ring-track: rgba(255, 255, 255, .14); --nav-bg: rgba(60, 60, 60, 0.8); --nav-active: rgba(255, 255, 255, 0.14);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); --muted: rgba(255, 255, 255, .55); --ex-ic: #9EF01A;
        }
        html[data-ui="flat"] body { --surface: #ebe7e2; --surface-edge: rgba(0, 0, 0, 0.04); --tile: #fbfaf8; --nav-bg: #ebe7e2; }
        html[data-ui="flat"] body[data-theme="dark"] { --surface: #333333; --surface-edge: rgba(255, 255, 255, 0.05); --tile: #1e1e1e; --pill: #4b4b4b; --nav-bg: #333333; }
        html[data-font="thin"] body { font-weight: 300; }

        .lg-backdrop { position: fixed; inset: 0; z-index: -2; pointer-events: none; background: var(--app-bg) center top / cover no-repeat, var(--bg-color); }
        @media (min-aspect-ratio: 4/3) { .lg-backdrop { background-position: left 18%; } }

        button { font: inherit; color: inherit; }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------- раскладка ---------- */
        .app { width: min(620px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 130px; box-sizing: border-box; }
        .view { display: none; flex-direction: column; gap: 18px; }
        .view.active { display: flex; animation: viewIn .25s ease; }
        @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .sec-title { text-align: center; font-size: 17px; font-weight: 600; margin: 6px 0 -6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sec-title .more { border: none; background: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 6px; border-radius: 8px; }
        .sec-title .more:hover { color: var(--text-color); }
        .card { background: var(--surface); border: 1px solid var(--surface-edge); border-radius: 26px; box-shadow: var(--card-shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        html[data-ui="liquid"] .card, html[data-ui="liquid"] .nav3, html[data-ui="liquid"] .pop, html[data-ui="liquid"] .sheet-card {
            -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
        .card-header { align-self: flex-start; background: var(--pill); box-shadow: var(--pill-shadow); border-radius: 10px; padding: 7px 16px; font-size: 1.02rem; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
        .tile { background: var(--tile); box-shadow: var(--tile-shadow); border-radius: 18px; }
        .hint { font-size: 13px; color: var(--muted); line-height: 1.45; }
        .page-head { display: flex; align-items: center; gap: 12px; }
        .back-btn { width: 42px; height: 42px; flex: none; border-radius: 12px; border: none; cursor: pointer; display: grid; place-items: center;
            background: var(--pill); box-shadow: var(--pill-shadow); color: var(--text-color); font-size: 26px; line-height: 1; padding-bottom: 3px; }
        .title-pill { background: var(--pill); box-shadow: var(--pill-shadow); border-radius: 12px; padding: 9px 18px; font-weight: 600; font-size: 1.12rem; display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
        .title-pill .ex-ic svg { width: 34px; height: 24px; }

        /* кнопки и поля */
        .btn { border: none; border-radius: 14px; padding: 12px 18px; cursor: pointer; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--green); color: #fff; text-shadow: 0 1px 1px rgba(40, 90, 0, .35); box-shadow: 0 3px 10px rgba(112, 224, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .35);
            transition: transform .12s, opacity .2s; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .45; cursor: default; transform: none; }
        .btn.secondary { background: var(--tile); color: var(--text-color); text-shadow: none; box-shadow: var(--tile-shadow); }
        .btn.danger { background: linear-gradient(180deg, #ff6b7a, #ef3d52); box-shadow: 0 3px 10px rgba(239, 61, 82, .3); text-shadow: none; }
        .btn.big { padding: 16px 22px; font-size: 17px; border-radius: 18px; }
        .btn.wide { width: 100%; }
        .btn .ui-ic svg { height: .85em; width: auto; display: block; }
        .input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 1px solid transparent; background: var(--tile); box-shadow: var(--tile-shadow);
            color: var(--text-color); font: inherit; font-size: 15px; outline: none; }
        .input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 25%, transparent); }
        .segmented { display: flex; background: rgba(128, 128, 128, .16); border-radius: 12px; padding: 3px; gap: 3px; }
        .segmented button { flex: 1; border: none; background: transparent; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .segmented button.active { background: var(--pill); box-shadow: var(--pill-shadow); font-weight: 600; }
        /* плавный «ползунок» в переключателях: подложка активного пункта переезжает, а не появляется скачком */
        .has-ind { position: relative; }
        .has-ind > :not(.seg-ind) { position: relative; z-index: 1; }
        .has-ind > .active, .has-ind > .on { background: transparent !important; box-shadow: none !important; }
        .seg-ind { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; border-radius: 9px; background: var(--pill); box-shadow: var(--pill-shadow); opacity: 0;
            transition: transform .34s cubic-bezier(.3, .9, .3, 1), width .34s cubic-bezier(.3, .9, .3, 1), height .34s cubic-bezier(.3, .9, .3, 1), opacity .2s; will-change: transform; }
        .w-tabs > .seg-ind { border-radius: 10px; }
        @media (prefers-reduced-motion: reduce) { .seg-ind { transition: none; } }
        /* свайпы: «назад» — круглая стрелка, выезжающая слева за пальцем */
        .swipe-back { position: fixed; left: 0; top: 50%; z-index: 9000; width: 46px; height: 46px; margin-top: -23px; border-radius: 50%; pointer-events: none;
            display: grid; place-items: center; background: var(--pill); box-shadow: var(--pill-shadow); color: var(--text-color); font-size: 28px; line-height: 1; padding-bottom: 3px; box-sizing: border-box;
            transform: translateX(-56px); opacity: 0; }
        .swipe-back.ready { background: var(--accent-color); color: #000; }
        .swipe-back.anim { transition: transform .25s ease, opacity .25s ease, background .15s; }
        .swipe-in-left { animation: swipeInLeft .28s cubic-bezier(.3, .9, .3, 1); }
        .swipe-in-right { animation: swipeInRight .28s cubic-bezier(.3, .9, .3, 1); }
        @keyframes swipeInLeft { from { transform: translateX(28px); opacity: .3; } to { transform: none; opacity: 1; } }
        @keyframes swipeInRight { from { transform: translateX(-28px); opacity: .3; } to { transform: none; opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .swipe-in-left, .swipe-in-right { animation: none; } }
        .chk { display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; }
        input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin: 0; flex: none; cursor: pointer; border-radius: 5px;
            background: rgba(128, 128, 128, .28); border: none; }
        input[type="checkbox"]:checked { background: #e3f7c8 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.2 6.3l2.4 2.4 5.2-5.4' fill='none' stroke='%2366c80e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / 14px no-repeat; }
        body[data-theme="dark"] input[type="checkbox"]:checked { background-color: rgba(255, 255, 255, .85); }
        input[type="checkbox"]:focus-visible, .btn:focus-visible, button:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }

        /* ---------- нижняя панель (как в ProdU) ---------- */
        .bottom-bar { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 100; display: flex; align-items: center; justify-content: center; gap: clamp(18px, 7vw, 110px); pointer-events: none; }
        .bottom-bar > * { pointer-events: auto; }
        .nav3 { display: flex; gap: 6px; padding: 6px; border-radius: 18px; background: var(--nav-bg); border: 1px solid var(--surface-edge); box-shadow: var(--card-shadow); }
        .nav3-btn { position: relative; width: 98px; height: 66px; border: none; border-radius: 14px; background: transparent; color: var(--text-color);
            display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .15s; -webkit-tap-highlight-color: transparent; }
        .nav3-btn svg { width: 38px; height: 38px; display: block; }
        #navHome svg { width: 31px; height: 31px; }
        #navProfile svg { width: 34px; height: 34px; }
        .nav3-btn:hover { background: color-mix(in srgb, var(--nav-active) 60%, transparent); }
        .nav3-btn:active { transform: scale(.95); }
        .nav3-btn.active { background: var(--nav-active); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06); }
        #navHome.active { background: color-mix(in srgb, var(--green-2) 18%, transparent); }
        .sync-dot { position: absolute; bottom: 10px; right: 26px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px var(--nav-bg); background: transparent; }
        .sync-dot[data-s="ok"] { background: #70E000; }
        .sync-dot[data-s="syncing"] { background: var(--blue); }
        .sync-dot[data-s="pending"], .sync-dot[data-s="offline"] { background: var(--warn); }
        .sync-dot[data-s="error"] { background: var(--danger); }
        .theme-switch { position: relative; width: 56px; height: 28px; flex: none; border: none; border-radius: 14px; padding: 0; cursor: pointer; background: #707070; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .25); transition: background .25s; }
        .theme-switch .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1), background .25s; }
        .theme-switch[aria-checked="true"] { background: #3e3e3e; }
        .theme-switch[aria-checked="true"] .knob { transform: translateX(28px); background: #8fe11a; }
        /* логотип справа и всплывающий логотип другой версии */
        .logo-wrap { position: relative; width: 52px; height: 52px; flex: none; }
        .logo-btn { width: 52px; height: 52px; padding: 0; border: none; background: none; border-radius: 15px; cursor: pointer; display: block; filter: drop-shadow(0 4px 10px rgba(112, 224, 0, .35)); -webkit-tap-highlight-color: transparent; }
        .logo-btn svg { width: 100%; height: 100%; display: block; border-radius: 15px; }
        .logo-wrap::before { content: ''; position: absolute; left: -6px; right: -6px; bottom: 100%; height: 0; }
        .logo-wrap.open::before { height: 140px; }
        /* над логотипом всплывают логотипы двух других версий; повторное нажатие плавно убирает их обратно */
        .logo-alts { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .logo-alt { position: relative; width: 52px; height: 52px; padding: 0; border: none; background: none; border-radius: 15px; cursor: pointer;
            transform: translateY(var(--drop, 14px)) scale(.6); opacity: 0; pointer-events: none; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .18));
            transition: transform .3s cubic-bezier(.5, 0, .7, .4), opacity .22s ease .06s; }
        .logo-alt:first-child { --drop: 76px; }
        .logo-alt:last-child { --drop: 14px; transition-delay: .07s, .12s; }   /* при сворачивании верхний уходит первым */
        .logo-alt svg { width: 100%; height: 100%; display: block; border-radius: 15px; }
        .logo-alt .lbl { position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px;
            background: var(--pill); box-shadow: var(--pill-shadow); color: var(--text-color); }
        .logo-wrap.open .logo-alt, .logo-alt:focus-visible { transform: none; opacity: 1; pointer-events: auto; transition: transform .38s cubic-bezier(.3, 1.5, .5, 1), opacity .2s ease; }
        .logo-wrap.open .logo-alt:first-child { transition-delay: .07s, .07s; }
        .logo-wrap.open .logo-alt:hover { transform: translateY(-2px) scale(1.06); transition-delay: 0s; }
        /* наведение мышью (на сенсорном экране показываем только по нажатию) */
        @media all {
            .logo-wrap.mhover:not(.shut)::before { height: 140px; }
            .logo-wrap.mhover:not(.shut) .logo-alt { transform: none; opacity: 1; pointer-events: auto; transition: transform .38s cubic-bezier(.3, 1.5, .5, 1), opacity .2s ease; }
            .logo-wrap.mhover:not(.shut) .logo-alt:first-child { transition-delay: .07s, .07s; }
            .logo-wrap.mhover:not(.shut) .logo-alt:hover { transform: translateY(-2px) scale(1.06); transition-delay: 0s; }
        }
        @media (max-width: 600px) {
            .bottom-bar { bottom: 10px; gap: 14px; }
            .nav3 { gap: 4px; padding: 5px; border-radius: 16px; }
            .nav3-btn { width: 62px; height: 54px; border-radius: 12px; }
            .nav3-btn svg { width: 30px; height: 30px; }
            #navHome svg { width: 25px; height: 25px; }
            #navProfile svg { width: 27px; height: 27px; }
            .sync-dot { bottom: 8px; right: 12px; }
            .theme-switch { width: 50px; height: 26px; }
            .theme-switch .knob { width: 20px; height: 20px; }
            .theme-switch[aria-checked="true"] .knob { transform: translateX(24px); }
            .logo-wrap, .logo-btn, .logo-alt { width: 46px; height: 46px; }
            .app { padding-top: 22px; }
        }
        @media (max-width: 350px) { .bottom-bar { gap: 8px; } .nav3-btn { width: 56px; } }

        /* всплывающие окна */
        .pop { position: fixed; z-index: 120; width: 280px; box-sizing: border-box; padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px;
            background: color-mix(in srgb, var(--surface) 70%, var(--bg-color)); border: 1px solid var(--surface-edge); box-shadow: 0 18px 50px rgba(0, 0, 0, .2); animation: popIn .22s cubic-bezier(.2, .8, .2, 1);
            max-height: calc(100vh - 120px); overflow-y: auto; }
        html[data-ui="flat"] .pop { background: var(--surface); }
        .pop[hidden] { display: none; }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
        .pop-title { text-align: center; background: var(--pill); box-shadow: var(--pill-shadow); border-radius: 10px; padding: 7px; font-weight: 600; font-size: 17px; }
        .pop-tile { background: var(--tile); box-shadow: var(--tile-shadow); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
        .pop-sub { font-size: 14px; font-weight: 600; }
        .pp-avatar { align-self: center; width: 88px; height: 88px; border-radius: 50%; padding: 3px; border: 1.5px solid #8fe11a; box-sizing: border-box; }
        .pp-avatar div { width: 100%; height: 100%; border-radius: 50%; background: #d6d6d6 center / cover no-repeat; display: grid; place-items: center; color: #fff; font-size: 34px; font-weight: 600; }
        .pp-hello { align-self: center; max-width: 100%; overflow-wrap: anywhere; text-align: center; background: var(--pill); box-shadow: var(--pill-shadow); border-radius: 10px; padding: 7px 14px; font-size: 16px; }
        .pp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .pp-stats div { background: var(--tile); box-shadow: var(--tile-shadow); border-radius: 12px; padding: 10px 6px; text-align: center; }
        .pp-stats b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .pp-stats small { font-size: 11px; color: var(--muted); }
        .pp-sync { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
        .pp-sync:empty { display: none; }

        /* окно редактирования привычки */
        .sheet { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(0, 0, 0, .45); }
        .sheet[hidden] { display: none; }
        .sheet-card { width: min(420px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; padding: 18px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px;
            background: color-mix(in srgb, var(--surface) 55%, var(--bg-color)); border: 1px solid var(--surface-edge); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); animation: popIn .22s ease; }
        .sheet-card h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .days button { border: none; border-radius: 10px; padding: 9px 0; cursor: pointer; background: rgba(128, 128, 128, .16); font-size: 13px; }
        .days button.on { background: var(--green); color: #fff; font-weight: 600; }
        .row2 { display: flex; gap: 10px; }
        .row2 > * { flex: 1; }

        /* уведомления на экране */
        .toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100% - 24px)); pointer-events: none; }
        .toast { background: var(--pill); color: var(--text-color); box-shadow: 0 10px 30px rgba(0, 0, 0, .2); border-radius: 14px; padding: 12px 14px; font-size: 14px; animation: popIn .25s ease; pointer-events: auto; }
        .toast b { display: block; font-weight: 600; margin-bottom: 2px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }


        /* ---------- ProdU Team ---------- */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { border: none; cursor: pointer; padding: 7px 11px; border-radius: 11px; background: var(--tile); box-shadow: var(--tile-shadow); font-size: 13px; color: var(--text-color); }
        .chip.on { background: var(--green); color: #fff; }
        .team-bar { display: flex; align-items: center; gap: 10px; }
        .team-pick { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; padding: 11px 16px; border-radius: 14px;
            background: var(--pill); box-shadow: var(--pill-shadow); font-size: 17px; font-weight: 600; color: var(--text-color); }
        .team-pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .team-pick[aria-expanded="true"] svg { transform: rotate(180deg); }
        .team-bar .icon-btn { width: 46px; height: 46px; border-radius: 14px; background: var(--pill); box-shadow: var(--pill-shadow); }
        .team-bar .icon-btn svg { width: 22px; height: 22px; }
        .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: rgba(128, 128, 128, .14); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--text-color); }
        .icon-btn svg { width: 16px; height: 16px; }
        .team-menu { position: absolute; z-index: 130; left: 0; right: 0; top: calc(100% + 8px); padding: 8px; border-radius: 18px; display: flex; flex-direction: column; gap: 4px;
            background: color-mix(in srgb, var(--surface) 55%, var(--bg-color)); border: 1px solid var(--surface-edge); box-shadow: 0 18px 50px rgba(0, 0, 0, .2); animation: popIn .2s ease; }
        html[data-ui="liquid"] .team-menu { -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
        .team-menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: transparent; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-size: 15px; }
        .team-menu button:hover { background: rgba(128, 128, 128, .12); }
        .team-menu button.on { background: var(--tile); box-shadow: var(--tile-shadow); font-weight: 600; }
        .team-menu small { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
        .team-menu hr { border: none; height: 1px; background: rgba(128, 128, 128, .2); margin: 4px 6px; }

        .cal-toolbar { display: flex; align-items: center; gap: 8px; }
        .cal-toolbar .cal-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
        .nav-btn { width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--tile); box-shadow: var(--tile-shadow); cursor: pointer; font-size: 22px; line-height: 1; padding-bottom: 3px; color: var(--text-color); }
        .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 11.5px; color: var(--muted); text-align: center; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
        .cal-day { position: relative; aspect-ratio: 1 / 1.05; min-height: 40px; border: none; border-radius: 12px; cursor: pointer; padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: var(--tile); box-shadow: var(--tile-shadow); color: var(--text-color); font-size: 14px; font-variant-numeric: tabular-nums; transition: transform .12s; }
        .cal-day:active { transform: scale(.95); }
        .cal-day.out { opacity: .4; }
        .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent-color), var(--tile-shadow); }
        .cal-day.sel { background: var(--green); color: #fff; font-weight: 600; }

        .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
        .cal-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, #999); }
        .cal-dots i.done { opacity: .35; }
        .cal-day.sel .cal-dots i { box-shadow: 0 0 0 1.5px #fff; }
        .cal-dots em { font-style: normal; font-size: 9.5px; line-height: 6px; opacity: .7; }

        .day-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .day-head .card-header { margin-right: auto; }
        .tasks { display: flex; flex-direction: column; gap: 10px; }
        .task-row { display: flex; gap: 12px; align-items: stretch; width: 100%; box-sizing: border-box; text-align: left; border: none; cursor: pointer; padding: 12px 14px; color: var(--text-color);
            transition: transform .12s; border-left: 4px solid var(--c, #999); }
        .task-row:active { transform: scale(.985); }
        .task-row.done .tr-title { text-decoration: line-through; opacity: .6; }
        .tr-time { flex: none; width: 54px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
        .tr-time small { font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
        .tr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
        .tr-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
        .tr-who { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
        .tr-who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .tr-track { position: relative; height: 6px; border-radius: 3px; background: var(--ring-track); overflow: hidden; }
        .tr-track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--c, #999); min-width: 4px; }
        .tr-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 6px; }
        .st { font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 8px; white-space: nowrap; background: rgba(128, 128, 128, .16); }
        .st.doing { background: color-mix(in srgb, var(--blue) 22%, transparent); color: color-mix(in srgb, var(--blue) 80%, var(--text-color)); }
        .st.done { background: color-mix(in srgb, var(--green-2) 22%, transparent); color: color-mix(in srgb, var(--green-2) 70%, var(--text-color)); }
        .cm-count { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
        .cm-count svg { width: 13px; height: 13px; }
        .empty { font-size: 14px; color: var(--muted); text-align: center; padding: 8px 4px; line-height: 1.45; }

        .av { --c: #999; flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff;
            background: var(--c) center / cover no-repeat; text-transform: uppercase; overflow: hidden; }
        .av.big { width: 44px; height: 44px; font-size: 18px; }
        .av.mid { width: 32px; height: 32px; font-size: 14px; }

        .invite-card { border: 2px solid color-mix(in srgb, var(--accent-color) 60%, transparent); }

        .invite-row .t { flex: 1 1 180px; }
        .invite-row .t small { display: block; color: var(--muted); font-size: 12px; }

        /* команда */
        .member { display: flex; align-items: center; gap: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; border: none; text-align: left; color: var(--text-color); }
        button.member { cursor: pointer; }
        .member .t { flex: 1; min-width: 0; }
        .member .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .member .t small { color: var(--muted); font-size: 12.5px; }
        .badge { font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: var(--green); color: #fff; white-space: nowrap; }
        .badge.grey { background: rgba(128, 128, 128, .18); color: var(--text-color); }
        .code-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .code { font-size: 26px; font-weight: 600; letter-spacing: .14em; font-variant-numeric: tabular-nums; padding: 8px 14px; border-radius: 12px; background: var(--tile); box-shadow: var(--tile-shadow); user-select: all; }
        .row-inline { display: flex; gap: 8px; align-items: center; }
        .row-inline .input { flex: 1; min-width: 0; }
        .suggest { display: flex; flex-direction: column; gap: 4px; }
        .suggest button { display: flex; align-items: center; gap: 10px; border: none; background: var(--tile); box-shadow: var(--tile-shadow); padding: 8px 10px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 14px; color: var(--text-color); }
        .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stats3 div { background: var(--tile); box-shadow: var(--tile-shadow); border-radius: 12px; padding: 10px 6px; text-align: center; }
        .stats3 b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .stats3 small { font-size: 11.5px; color: var(--muted); }

        /* карточка задачи */
        .sheet-card.wide { width: min(560px, 100%); }
        .sheet-head { display: flex; align-items: center; gap: 10px; }
        .sheet-head h3 { flex: 1; }
        .close-x { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(128, 128, 128, .16); cursor: pointer; font-size: 18px; color: var(--text-color); flex: none; }
        textarea.input { resize: vertical; min-height: 70px; line-height: 1.4; }
        select.input { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.6' stroke-linecap='round'/></svg>");
            background-repeat: no-repeat; background-position: right 12px center; background-size: 12px; padding-right: 32px; }

        .dur-row .segmented { flex: 1; }

        .cm .bubble { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 14px; background: var(--tile); box-shadow: var(--tile-shadow); font-size: 14px; line-height: 1.4; }

        .cm .bubble small { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
        .cm .bubble p { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .cm.mine .bubble { background: color-mix(in srgb, var(--green-2) 14%, var(--tile)); }
        .cm .del { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 2px 4px; }
        .cm-input { display: flex; gap: 8px; align-items: flex-end; }
        .cm-input textarea { flex: 1; min-height: 44px; max-height: 140px; }
        .cm-input .btn { padding: 12px 14px; }
        .gate { text-align: center; align-items: center; padding: 26px 18px; }
        .gate svg { width: 84px; height: 84px; border-radius: 24px; }
        .gate h2 { margin: 6px 0 0; font-size: 20px; font-weight: 600; }
        .gate p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 380px; }
        .loading { display: flex; justify-content: center; padding: 30px 0; }
        .loading .spinner { width: 26px; height: 26px; border: 3px solid rgba(128, 128, 128, .25); border-top-color: var(--accent-color); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- рабочее пространство: боковая панель + календарь ---------- */
        .app { width: min(1440px, calc(100% - 32px)); padding-top: 22px; }
        .narrow, #view-team { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        body { --grid-line: rgba(0, 0, 0, .075); }

        .tm-side { position: sticky; top: 16px; max-height: calc(100vh - 140px); overflow-y: auto; padding: 12px; gap: 2px; }
        .tm-scrim { display: none; }
        .side-sec { display: flex; flex-direction: column; gap: 2px; }
        .side-t { font-size: 12.5px; color: var(--muted); margin: 14px 10px 4px; }
        .side-t small { font-size: 11px; opacity: .8; }
        .sn { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; padding: 9px 10px; border: none; border-radius: 12px; background: transparent; cursor: pointer;
            font-size: 15px; color: var(--text-color); text-align: left; transition: background .15s, opacity .15s; }

        .sn > svg { width: 20px; height: 20px; flex: none; }
        .sn > span:not(.cnt):not(.dot):not(.tsq):not(.av) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sn small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
        .sn .cnt { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
        .sn.muted { color: var(--muted); font-size: 14px; }
        .tsq { width: 22px; height: 22px; flex: none; border-radius: 7px; background: var(--c); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; text-transform: uppercase; }
        .sn.sm { padding: 7px 10px; font-size: 14px; }
        .sn .dot { width: 10px; height: 10px; flex: none; border-radius: 3px; background: var(--c); transition: background .15s, box-shadow .15s; }
        .sn.off { opacity: .45; }
        .sn.off .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
        .tm-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
        .tm-head { display: flex; align-items: center; gap: 12px; }
        .tm-h-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
        .tm-head h1 { margin: 0; font-size: clamp(17px, 2.1vw, 25px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2;
            background: var(--pill); box-shadow: var(--pill-shadow); border-radius: 12px; padding: 7px 16px; max-width: 100%; box-sizing: border-box; }
        .tm-h-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--pill); box-shadow: var(--pill-shadow); place-items: center; display: inline-grid; flex: none; }
        .tm-h-ic svg { width: 24px !important; height: 24px !important; }
        .tm-tools .segmented { background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--tile-shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
        .team-chip { background: var(--pill) !important; box-shadow: var(--pill-shadow); padding: 3px 9px !important; border-radius: 8px; }
        .team-chip { display: none; border: none; background: none; padding: 0; font-size: 13px; color: var(--muted); cursor: pointer; align-items: center; gap: 5px; }
        .team-chip svg { width: 10px; height: 10px; }
        .menu-btn { display: none; }
        .add-btn { padding: 10px 16px; }
        .btn > svg { width: 18px; height: 18px; flex: none; }
        .add-btn svg { width: 16px; height: 16px; }
        .tm-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        #viewSwitch { width: min(440px, 100%); }
        .nav-group { margin-left: auto; display: flex; align-items: center; gap: 6px; }
        .today-btn { padding: 9px 14px; font-size: 14px; }
        .tm-cal { padding: 0; overflow: hidden; gap: 0; }
        .tm-cal.is-list { padding: 14px; }
        .tm-list { display: flex; flex-direction: column; gap: 10px; }
        .day-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 4px -2px; }
        .day-label.late { color: var(--danger); }

        /* сетка часов */
        .tg { --lw: 58px; }
        .tg-row { display: grid; grid-template-columns: var(--lw) repeat(var(--n), minmax(0, 1fr)); }
        .tg-head { border-bottom: 1px solid var(--grid-line); }
        .tg-dh { border: none; background: none; cursor: pointer; padding: 12px 8px 9px; font-size: 13px; color: var(--muted); text-align: left; white-space: nowrap; overflow: hidden; min-width: 0; }
        .tg-dh b { font-weight: 600; color: var(--text-color); }
        .tg-dh:hover b { text-decoration: underline; }
        .tg-dh.today, .tg-dh.today b { color: var(--green-2); }
        .tg-allday { border-bottom: 1px solid var(--grid-line); min-height: 42px; }
        .tg-lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; padding: 4px 8px 4px 0; text-align: right; line-height: 1.2; }
        .tg-ad-cell { border-left: 1px solid var(--grid-line); padding: 4px 3px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
        .tg-body { overflow-y: auto; height: clamp(320px, calc(100vh - 330px), 2400px); overscroll-behavior: contain; position: relative; }
        .tg-grid { height: calc(var(--hh) * 24); }
        .tg-hours { position: relative; }
        .tg-hours span { position: absolute; right: 8px; font-size: 12px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
        .tg-col { position: relative; border-left: 1px solid var(--grid-line); cursor: copy;
            background-image: linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); background-size: 100% var(--hh); }
        .tg-col.today { background-color: color-mix(in srgb, var(--green-2) 5%, transparent); }
        .tg-now { position: absolute; left: 0; right: 0; height: 2px; margin-top: -1px; background: var(--danger); z-index: 3; pointer-events: none; }
        .tg-now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
        .tb { position: absolute; z-index: 2; border: none; border-radius: 8px; padding: 4px 7px; box-sizing: border-box; overflow: hidden; text-align: left; cursor: pointer; color: #fff;
            background: var(--c); box-shadow: 0 2px 6px rgba(0, 0, 0, .14), inset 0 0 0 1px rgba(255, 255, 255, .12); display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; line-height: 1.22;
            text-shadow: 0 1px 1px rgba(0, 0, 0, .18); transition: transform .12s, box-shadow .12s; }
        .tb:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0, 0, 0, .2); z-index: 4; }
        .tb-t { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: var(--lines, 3); -webkit-box-orient: vertical; overflow-wrap: anywhere; }
        .tb-time { font-size: 11px; opacity: .88; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .tb.short { flex-direction: row; align-items: center; gap: 6px; padding-top: 2px; padding-bottom: 2px; }
        .tb.short .tb-t { -webkit-line-clamp: 1; flex: 1; min-width: 0; }
        .tb.st-done, .chip-t.st-done { opacity: .5; }
        .tb.st-done .tb-t, .chip-t.st-done { text-decoration: line-through; }
        .chip-t { display: block; width: 100%; box-sizing: border-box; border: none; border-radius: 7px; padding: 3px 7px; font-size: 12px; font-weight: 600; color: #fff; background: var(--c);
            cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-shadow: 0 1px 1px rgba(0, 0, 0, .18); flex: none; }
        .chip-t em { font-style: normal; font-weight: 400; opacity: .9; margin-right: 4px; }
        .tg-more { border: none; background: none; font-size: 11.5px; color: var(--muted); cursor: pointer; text-align: left; padding: 0 4px; font-weight: 600; }
        /* месяц */
        .mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .mg-wd { padding: 10px 8px 6px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--grid-line); }
        .mc { min-height: max(84px, calc((100vh - 360px) / 6)); border-left: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); padding: 4px; display: flex; flex-direction: column; gap: 3px; cursor: copy; min-width: 0; }
        .mc.c0 { border-left: none; }
        .mc.out { opacity: .45; }
        .mc-d { align-self: flex-start; border: none; background: none; font-size: 13px; font-weight: 600; padding: 2px 7px; border-radius: 8px; cursor: pointer; color: var(--text-color); font-variant-numeric: tabular-nums; }
        .mc.today .mc-d { background: var(--green); color: #fff; }

        @media (max-width: 900px) {
            .tm-shell { display: block; }
            .tm-side { position: fixed; z-index: 950; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); max-height: none; border-radius: 0 24px 24px 0; padding: 18px 12px calc(18px + env(safe-area-inset-bottom));
                background: color-mix(in srgb, var(--surface) 40%, var(--bg-color)); transform: translateX(-105%); transition: transform .28s cubic-bezier(.3, .9, .3, 1); box-shadow: 0 0 40px rgba(0, 0, 0, .25); }
            .tm-shell.drawer .tm-side { transform: none; }
            .tm-scrim { display: block; position: fixed; inset: 0; z-index: 940; background: rgba(0, 0, 0, .38); opacity: 0; pointer-events: none; transition: opacity .25s; }
            .tm-shell.drawer .tm-scrim { opacity: 1; pointer-events: auto; }
            .menu-btn { display: grid; width: 42px; height: 42px; border-radius: 12px; background: var(--pill); box-shadow: var(--pill-shadow); }
            .menu-btn svg { width: 20px; height: 20px; }
            .tm-h-ic { display: none; }
            .team-chip { display: inline-flex; }
        }
        @media (max-width: 700px) {
            .tm-h-pre { display: none; }
            .add-btn span { display: none; }
            .add-btn { padding: 11px; border-radius: 12px; }
            .tg { --lw: 40px; }
            .tg-hours span { right: 5px; font-size: 10.5px; }
            .tg-dh { padding: 10px 4px 8px; font-size: 11.5px; text-align: center; }
            .tg-dh span { display: block; }
            .tg-lbl { font-size: 10px; padding-right: 4px; }
            .tb { padding: 3px 5px; font-size: 11.5px; border-radius: 6px; }
            .chip-t { font-size: 11px; padding: 2px 5px; border-radius: 5px; }
            .tg-body { height: clamp(280px, calc(100vh - 390px), 2400px); }
            .mc { min-height: 76px; padding: 3px 2px; }
            .mc .chip-t em { display: none; }
            .mg-wd { padding: 8px 4px 5px; text-align: center; }
            .mc-d { align-self: center; }
            .nav-group { margin-left: 0; width: 100%; justify-content: space-between; }
            .nav-group .today-btn { flex: 1; }
            #viewSwitch { width: 100%; }
        }
    </style>
</head>

    <script>
        // ================================================================
        // ProdU Team — командная версия ProdU: команды с лидером и ролями,
        // общий календарь задач с длительностью и исполнителем, комментарии.
        // Вход, тема и оформление общие с основной ProdU; адрес сервера берётся оттуда же.
        const TEAM_SERVER_URL = '';
        // ================================================================
        const $ = id => document.getElementById(id);
        const pad = n => String(n).padStart(2, '0');
        const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
        const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
        const todayStr = () => ymd(new Date());
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const ruPlural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b > 1 && b < 5 ? few : b === 1 ? one : many; };
        const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        const wdIndex = d => (d.getDay() + 6) % 7;
        function lsGet(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }

        // --- задачи по дням ---

        }
        // отрезок задачи со временем внутри дня (задача может перейти через полночь)

                const cols = [];
                cluster.forEach(it => { let c = cols.findIndex(end => end <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.ve; it.col = c; });

        // --- месяц ---
        function monthHtml() {
            const c = parseYmd(cursor), first = new Date(c.getFullYear(), c.getMonth(), 1), start = addDays(first, -wdIndex(first));
            const src = visibleTasks(), today = todayStr(), max = window.innerWidth < 700 ? 2 : 3;
            let cells = '';
            for (let i = 0; i < 42; i++) {
                const d = addDays(start, i), ds = ymd(d);

                const items = tasksOn(ds, src);
                cells += `<div class="mc ${i % 7 === 0 ? 'c0' : ''} ${d.getMonth() !== first.getMonth() ? 'out' : ''} ${ds === today ? 'today' : ''}" onclick="slotClick(event, '${ds}', null)">

        // --- списки: Сегодня / Мои задачи / Все задачи ---
        function relDay(ds) {

        function taskRowHtml(t, ds) {
            const m = memberById(t.assignee);

        function listHtml() {
            const today = todayStr();
            let groups = [];

            else {
                const src = mode === 'mine' ? T.tasks.filter(t => t.assignee === T.me.id && t.status !== 'done') : visibleTasks();
                const overdue = src.filter(t => t.status !== 'done' && ymd(addDays(parseYmd(t.date), durDays(t) - 1)) < today);
                const upcoming = src.filter(t => !overdue.includes(t) && ymd(addDays(parseYmd(t.date), durDays(t) - 1)) >= today);
                if (overdue.length) groups.push(['overdue', overdue.sort((a, b) => a.date.localeCompare(b.date))]);
                const byDay = new Map();
                upcoming.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '')).slice(0, 300)
                    .forEach(t => { const k = t.date < today ? today : t.date; if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(t); });
                groups.push(...byDay.entries());
            }
            const html = groups.filter(([, items]) => items.length).map(([k, items]) => `<div class="day-label ${k === 'overdue' ? 'late' : ''}">${k === 'overdue' ? 'Просрочено' : relDay(k)}</div>

        // клик по пустому месту календаря — новая задача на это время

                if (pop) { const seg = target.closest('.segmented'); return seg ? { type: 'seg', el: seg } : { type: 'pop', el: pop }; }
                const seg = target.closest('.segmented');
                if (seg) return { type: 'seg', el: seg };
                if (drawerOpen && target.closest('.tm-side')) return { type: 'custom', go: dir => { if (dir > 0) toggleDrawer(false); } };
                if (target.closest('#tgBody, .mg, .tg-allday, .tg-head')) return { type: 'custom', feedback: document.querySelector('.tm-cal'), go: dir => { calShift(dir); swSlideIn(document.querySelector('.tm-cal'), dir); } };
                if (currentView !== 'home') return { type: 'back' };
                return null;
            },
            // от левого края: в разделе — назад, на главной телефона — открыть панель с командами
            edgeBack() { return !openPop && !swModalTeam() && (currentView !== 'home' || (window.innerWidth <= 900 && !!T && !drawerOpen)); },
            back() { if (currentView !== 'home') showView('home'); else toggleDrawer(true); },
            closePop() { closePops(); }
        };

        // ================= ЗАПУСК =================
        renderSettings();
        setNet('none');
        boot();
        requestAnimationFrame(() => setTimeout(() => $('curtain').classList.add('hide'), (() => { try { return sessionStorage.getItem('produ_wipe'); } catch (e) { return null; } })() ? 150 : 350));
        try { sessionStorage.removeItem('produ_wipe'); } catch (e) {}
        if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
